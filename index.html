    <!-- set the mode on <html> before first paint so a chosen theme never flashes.
         default is dark; only an explicit light choice turns it off -->
    <script>
      (function () {
        var dark = true;
        try {
          dark = localStorage.getItem('theme') !== 'light';
        } catch (e) {
          /* storage blocked — stay dark */
        }
        if (dark) document.documentElement.classList.add('dark');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#353535' : '#ffffff');
      })();
    </script>
